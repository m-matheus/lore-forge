<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LoreForge{% endblock %}</title>
  <link rel="stylesheet" href="/static/pico.min.css?v={{ asset_v('pico.min.css') }}">
  <link rel="stylesheet" href="/static/app.css?v={{ asset_v('app.css') }}">
  <script src="/static/alpine.min.js?v={{ asset_v('alpine.min.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block shell %}
  <header class="container topbar">
    <nav>
      <ul>
        <li><a href="/" class="brand"><strong>LORE<span>FORGE</span></strong></a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
